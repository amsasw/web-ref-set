<!doctype html>
<html lang="zh-CN">

<title>风格集 STYLEKIT · 网页设计灵感库</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#191b26;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#ffffffdf;backdrop-filter:blur(15px);border-bottom:1px solid #e6e8f0;padding:15px max(20px,calc((100vw - 1200px)/2));display:flex;gap:18px;align-items:center;z-index:2}.logo{font-weight:900;font-size:21px;white-space:nowrap}.logo b{color:#635bff}input{min-width:0;flex:1;border:1px solid #e1e4ee;background:#fff;border-radius:10px;padding:11px 13px;font:inherit}main{max-width:1200px;margin:auto;padding:35px 22px}.eyebrow{color:#635bff;font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-1.8px;margin:10px 0}p{line-height:1.65}.muted{color:#747b8c}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.filters button,.btn{border:1px solid #e1e4ee;background:white;border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit}.filters button.active,.primary{background:#635bff!important;color:#fff;border-color:#635bff!important}.theme-link{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0;padding:18px 20px;border:1px solid #dcdcff;border-radius:16px;background:linear-gradient(115deg,#f1f0ff,#fff 68%);text-decoration:none;color:#252442}.theme-link strong{display:block;font-size:15px;margin-bottom:4px}.theme-link span{display:block;color:#747b8c;font-size:12px;line-height:1.5}.theme-link b{white-space:nowrap;background:#635bff;color:#fff;padding:10px 13px;border-radius:10px;font-size:12px}@media(max-width:580px){.theme-link{align-items:flex-start;flex-direction:column}.theme-link b{white-space:normal}}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e6e8f0;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #1a21400a;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 35px #1a214018}.preview{height:205px;padding:18px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink)}.preview:after{content:"";position:absolute;right:-35px;top:38px;width:170px;height:170px;border-radius:50%;background:var(--glow);filter:blur(3px);opacity:.7;transition:.3s}.card:hover .preview:after{transform:scale(1.18)}.brand{font-size:10px;font-weight:800;position:relative;z-index:1}.preview h2{font-size:27px;line-height:1.15;max-width:82%;position:relative;z-index:1;margin:30px 0 10px}.preview p{font-size:11px;max-width:75%;position:relative;z-index:1}.mini{display:flex;gap:7px;margin-top:15px;position:relative;z-index:1}.mini i{height:28px;border-radius:5px;background:var(--panel);flex:1}.body{padding:16px}.title{display:flex;align-items:center;gap:9px}.title h3{margin:0;font-size:17px}.tag{font-size:11px;background:#f0f1f6;padding:5px 7px;border-radius:6px;color:#666}.heart{margin-left:auto;border:1px solid #e1e4ee;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;color:#d64e7c}.desc{color:#747b8c;font-size:13px;min-height:42px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.meta span{font-size:11px;background:#f6f7fa;padding:5px 7px;border-radius:5px;color:#686f80}.actions{display:flex;gap:8px}.actions button{flex:1;font-size:12px}.empty{display:none;padding:60px;text-align:center;color:#747b8c}.modal{display:none;position:fixed;inset:0;background:#0b102099;z-index:5;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:#fff;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.dialog-head{display:flex;align-items:center;gap:10px}.dialog-head button{margin-left:auto}.hero-preview{padding:24px;border-radius:12px;margin:16px 0;background:var(--bg);color:var(--ink)}.hero-preview h2{font-size:clamp(28px,5vw,45px);margin:40px 0 10px}.swatches{display:flex;gap:8px;margin:12px 0}.swatches i{width:38px;height:38px;border-radius:9px;border:1px solid #0001}footer{text-align:center;padding:25px;color:#8b90a0;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){header{flex-wrap:wrap;padding:12px 15px}header input{flex-basis:100%;order:3}.grid{grid-template-columns:1fr}main{padding:25px 15px}.preview{height:210px}}
</style></head>
<body>
<header><div class="logo">风格<b>集</b> / STYLEKIT</div><input id="search" placeholder="搜索风格、关键词或使用场景…"></header>
<main><div class="eyebrow">DESIGN EXPLORER · 001</div><h1>找到下一次设计的灵感。</h1><p class="muted">探索不同视觉语言与网页布局。筛选、预览、收藏，把灵感变成你的下一款网站。</p><p><a class="btn" href="references/index.html">浏览产品参考作品：牙膏与口腔 · 母婴 ↗</a></p><p class="muted"><strong id="count">12</strong> 种风格 · 可筛选、预览和拆解配色</p><a class="theme-link" href="./toothpaste_theme_demo.html"><div><strong>固定主题实验：清序 · 薄荷牙膏</strong><span>同一份产品内容，四种视觉风格；支持并排对比、规格选择和桌面 / 平板 / 手机预览。</span></div><b>打开主题实验 ↗</b></a><nav class="filters" id="filters"></nav><section class="grid" id="grid"></section><div class="empty" id="empty">没有找到匹配的风格，试试其他关键词。</div></main>
<footer>风格集 STYLEKIT · 网页设计灵感库 · HTML / CSS / JavaScript</footer>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">风格预览</h3><button class="btn" id="close">关闭 ✕</button></div><div class="hero-preview" id="heroPreview"><div id="modalBrand"></div><h2 id="modalHeadline"></h2><p id="modalSub"></p></div><h4>设计说明</h4><p class="muted" id="modalDesc"></p><h4>适用场景</h4><p class="muted" id="modalUse"></p><h4>配色参考</h4><div class="swatches" id="swatches"></div><pre id="css"></pre><button class="btn primary" id="copy">复制 CSS 配色</button></div></div>
<script>
const data=[
["现代简约","简约","留白 · 秩序","克制排版、充足留白与清晰层级，让内容成为视觉中心。","品牌官网、作品集、SaaS 产品","#f5f4f0","#d6ded1","#20231f","#e7e9e3","Form & Field","让好想法，拥有好设计。"],
["深色科技","科技","深色 · 光效","深色背景搭配高亮渐变和玻璃质感，呈现未来感与技术力量。","AI 产品、开发者工具、游戏品牌","#090d1b","#6046ff","#f6f7ff","#171c35","NOVA / AI","未来，不止于想象。"],
["自然清新","自然","柔和 · 有机","自然色系、柔和曲线与大幅图片，传达舒适与可持续理念。","环保品牌、健康生活、户外旅行","#edf4eb","#9fcbb0","#234b3c","#d9e8d9","NATURE / LIVING","与自然同行，发现日常之美。"],
["商务专业","商务","稳重 · 信任","严谨网格、明确数据层级和可信赖的深蓝配色。","企业官网、金融服务、咨询公司","#10223c","#2865a8","#f7faff","#1d3555","NORTHSTAR","专业能力，推动持续增长。"],
["创意艺术","艺术","大胆 · 表达","高饱和色块、非对称构图和强烈标题，强调品牌个性。","创意工作室、艺术家、文化活动","#fff0ed","#f24b78","#29202c","#ffd7ce","ARTSPACE","灵感无边界，创作正当时。"],
["极简黑白","简约","黑白 · 建筑感","用黑白灰、强对比与精确间距塑造理性视觉。","建筑事务所、设计师作品集、高端品牌","#f1f1ef","#a5a5a0","#171717","#dededb","YU / DESIGN OFFICE","少一点装饰，多一点表达。"],
["复古怀旧","复古","暖调 · 质感","奶油色、棕褐色与经典字体，营造故事感和时间沉淀。","咖啡馆、独立出版、手作品牌","#f1e3c9","#b87542","#4a2c1c","#e3cba8","THE VINTAGE CLUB","一杯咖啡，一段好时光。"],
["动态视觉","动态","动效 · 渐变","流动渐变、悬停反馈和微动效，为页面增加节奏感。","数字创意、活动专题、互动体验","#100c2b","#a84dff","#ffffff","#251a50","FLOW / DIGITAL","Dream bigger. Create faster."],
["旅行探索","自然","影像 · 探索","大图沉浸式首屏、目的地卡片和轻量筛选。","旅行平台、酒店民宿、户外品牌","#e9f3f6","#45a6c8","#123e55","#cfe7ef","WANDER","去看更大的世界。"],
["电商购物","商务","商品 · 转化","商品图、价格、筛选与行动按钮，让浏览路径直接高效。","独立品牌、数码产品、家居零售","#faf6f0","#d7bda3","#302820","#eee2d3","SHOP EASE","好物，让生活更有质感。"],
["个人博客","内容","阅读 · 叙事","重视阅读节奏、文章封面与作者信息。","技术博客、个人随笔、知识分享","#f4f1e9","#c5b69b","#292c31","#e5dfd2","LIFELOG / NOTES","记录生活，分享思考。"],
["知识文库","内容","信息 · 检索","清晰导航、搜索入口与分类卡片，帮助用户快速找内容。","文档中心、在线课程、产品帮助中心","#eaf0f8","#4e7fbd","#17375e","#d5e2f2","LEARNHUB / DOCS","获取知识，成就更好的自己。"]
].map((a,i)=>({id:i,name:a[0],cat:a[1],tag:a[2],desc:a[3],use:a[4],bg:a[5],glow:a[6],ink:a[7],panel:a[8],brand:a[9],headline:a[10],sub:"探索风格与布局，将灵感拆解为可复用的设计语言。"}));
const cats=["全部","简约","科技","自然","商务","艺术","复古","动态","内容"];let cat="全部";const fav=new Set();const $=x=>document.getElementById(x);
function style(s){return `--bg:${s.bg};--glow:${s.glow};--ink:${s.ink};--panel:${s.panel}`}
function render(){const q=$("search").value.trim().toLowerCase();const list=data.filter(s=>(cat==="全部"||s.cat===cat)&&[s.name,s.cat,s.tag,s.desc,s.use].join(" ").toLowerCase().includes(q));$("grid").innerHTML=list.map(s=>`<article class="card"><div class="preview" style="${style(s)}"><div class="brand">${s.brand}</div><h2>${s.headline}</h2><p>${s.sub}</p><div class="mini"><i></i><i></i><i></i></div></div><div class="body"><div class="title"><h3>${s.name}</h3><span class="tag">${s.tag}</span><button class="heart" data-fav="${s.id}">${fav.has(s.id)?"♥":"♡"}</button></div><p class="desc">${s.desc}</p><div class="meta"><span>${s.cat}</span><span>${s.use.split("、")[0]}</span></div><div class="actions"><button class="btn primary" data-open="${s.id}">打开预览 ↗</button><button class="btn" data-open="${s.id}">设计要点</button></div></div></article>`).join("");$("empty").style.display=list.length?"none":"block";$("count").textContent=list.length}
$("filters").innerHTML=cats.map(c=>`<button data-cat="${c}" class="${c===cat?"active":""}>${c}</button>`).join("");
$("filters").onclick=e=>{if(e.target.dataset.cat){cat=e.target.dataset.cat;[...$("filters").children].forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));render()}};
$("search").oninput=render;$("grid").onclick=e=>{if(e.target.dataset.fav!==undefined){const id=+e.target.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);render();return}const b=e.target.closest("[data-open]");if(!b)return;const s=data[+b.dataset.open];$("modalTitle").textContent=s.name;$("heroPreview").style.cssText=style(s);$("modalBrand").textContent=s.brand;$("modalHeadline").textContent=s.headline;$("modalSub").textContent=s.sub;$("modalDesc").textContent=s.desc;$("modalUse").textContent=s.use;$("swatches").innerHTML=[s.bg,s.glow,s.ink,s.panel].map(c=>`<i title="${c}" style="background:${c}"></i>`).join("");$("css").textContent=`:root {\n --page-bg: ${s.bg};\n --accent: ${s.glow};\n --text: ${s.ink};\n --panel: ${s.panel};\n}`;$("modal").classList.add("open")};
$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").classList.remove("open")});$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("css").textContent);$("copy").textContent="已复制 ✓"}catch{alert("复制失败，请手动复制 CSS。")}};render();
</script></body></html>
